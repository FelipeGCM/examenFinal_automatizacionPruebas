name: Integración Continua

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn clean compile

      - name: Ejecutar pruebas unitarias y BDD
        run: mvn test

      - name: Ejecutar pruebas de integración
        run: mvn failsafe:integration-test failsafe:verify

      - name: Generar reporte HTML de pruebas unitarias
        if: always()
        run: mvn site

      - name: Guardar reporte de pruebas unitarias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-unitarias
          path: |
            target/site/
            target/surefire-reports/
          if-no-files-found: warn

      - name: Guardar reporte de integración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-integracion
          path: target/failsafe-reports/
          if-no-files-found: warn

      - name: Guardar reporte BDD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-bdd-cucumber
          path: target/cucumber-report.html
          if-no-files-found: warn

      - name: Instalar JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          echo "$GITHUB_WORKSPACE/apache-jmeter-5.6.3/bin" >> $GITHUB_PATH

      - name: Iniciar servidor para prueba de performance
        run: |
          nohup java -cp target/classes cl.figio.automatizacion.LoginHttpServer > servidor-login.log 2>&1 &
          sleep 3

      - name: Ejecutar prueba de performance
        run: |
          mkdir -p performance/results
          jmeter -n \
            -t performance/login-performance-test.jmx \
            -l performance/results/resultados.jtl \
            -e \
            -o performance/report

      - name: Validar resultados de performance
        shell: bash
        run: |
          if grep -q "false" performance/results/resultados.jtl; then
            echo "::error::Se detectaron errores o degradaciones en la prueba de performance"
            exit 1
          fi

          echo "Prueba de performance completada sin degradaciones"

      - name: Guardar dashboard de performance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-performance-jmeter
          path: |
            performance/report/
            performance/results/resultados.jtl
          if-no-files-found: warn